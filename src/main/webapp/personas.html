<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestión de personas</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>


<body class="bg-light">

	<div class="container py-5">

		<div
			class="d-flex justify-content-between
                align-items-center mb-4">

			<div>
				<h1>Personas</h1>

				<p class="text-muted mb-0">CRUD mediante Servlets y XML</p>
			</div>


			<a href="persona.html" class="btn btn-primary"> Nueva persona </a>

		</div>


		<div class="card shadow-sm">

			<div class="card-body">

				<table
					class="table table-hover
                          align-middle mb-0">

					<thead class="table-dark">

						<tr>

							<th>ID</th>
							<th>Nombre</th>
							<th>Edad</th>
							<th class="text-end">Acciones</th>

						</tr>

					</thead>


					<tbody id="tablaPersonas">

						<tr>

							<td colspan="4" class="text-center text-muted">Cargando...</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>


	<script>

const URL_PERSONAS = "ej01_personas";


async function cargarPersonas() {

    try {

        /*
         * GET /ej01_personas
         */
        const respuesta =
            await fetch(URL_PERSONAS);


        const xml =
            await respuesta.text();


        /*
         * Convertimos el texto recibido
         * en un documento XML.
         */
        const documento =
            new DOMParser()
                .parseFromString(
                    xml,
                    "application/xml"
                );


        if (!respuesta.ok) {

            const mensaje =
                documento
                    .querySelector("mensaje")
                    ?.textContent
                    || "Error al obtener las personas.";

            mostrarError(mensaje);

            return;
        }


        /*
         * Obtenemos todos los elementos <persona>.
         */
        const personas =
            documento.querySelectorAll("persona");


        const tabla =
            document.getElementById(
                "tablaPersonas"
            );


        tabla.innerHTML = "";


        personas.forEach(persona => {

            const id =
                persona.querySelector("id")
                    .textContent;

            const nombre =
                persona.querySelector("nombre")
                    .textContent;

            const edad =
                persona.querySelector("edad")
                    .textContent;


            const fila =
                document.createElement("tr");


            /*
             * Creamos las celdas.
             */
            const celdaId =
                document.createElement("td");

            celdaId.textContent = id;


            const celdaNombre =
                document.createElement("td");

            celdaNombre.textContent = nombre;


            const celdaEdad =
                document.createElement("td");

            celdaEdad.textContent = edad;


            const celdaAcciones =
                document.createElement("td");

            celdaAcciones.className =
                "text-end";


            /*
             * Botón "Ver / editar".
             */
            const enlace =
                document.createElement("a");

            enlace.href =
                `persona.html?id=${id}`;

            enlace.className =
                "btn btn-sm btn-outline-primary me-2";

            enlace.textContent =
                "Ver / editar";


            /*
             * Botón "Eliminar".
             */
            const boton =
                document.createElement("button");

            boton.className =
                "btn btn-sm btn-outline-danger";

            boton.textContent =
                "Eliminar";


            boton.addEventListener(
                "click",
                () => eliminarPersona(id)
            );


            celdaAcciones.appendChild(enlace);
            celdaAcciones.appendChild(boton);


            fila.appendChild(celdaId);
            fila.appendChild(celdaNombre);
            fila.appendChild(celdaEdad);
            fila.appendChild(celdaAcciones);


            tabla.appendChild(fila);

        });

    } catch (error) {

        console.error(error);

        mostrarError(
            "No se ha podido conectar con el servidor."
        );
    }
}


async function eliminarPersona(id) {

    if (!confirm(
        "¿Seguro que quieres eliminar esta persona?"
    )) {

        return;
    }


    try {

        /*
         * DELETE /ej01_personas/eliminar?id=2
         */
        const respuesta =
            await fetch(
                `${URL_PERSONAS}/eliminar?id=${id}`,
                {
                    method: "DELETE"
                }
            );


        const xml =
            await respuesta.text();


        const documento =
            new DOMParser()
                .parseFromString(
                    xml,
                    "application/xml"
                );


        if (!respuesta.ok) {

            const mensaje =
                documento.querySelector("mensaje")
                    ?.textContent
                || "No se ha podido eliminar.";

            alert(mensaje);

            return;
        }


        /*
         * El Servlet ha devuelto XML.
         */
        const mensaje =
            documento.querySelector("mensaje")
                .textContent;


        alert(mensaje);


        /*
         * Volvemos a cargar el listado.
         */
        cargarPersonas();


    } catch (error) {

        console.error(error);

        alert(
            "No se ha podido conectar con el servidor."
        );
    }
}


function mostrarError(mensaje) {

    document.getElementById(
        "tablaPersonas"
    ).innerHTML = `
        <tr>
            <td colspan="4"
                class="text-center text-danger">
                ${mensaje}
            </td>
        </tr>
    `;
}


/*
 * Cargamos la tabla al abrir la página.
 */
cargarPersonas();

</script>

</body>

</html>
